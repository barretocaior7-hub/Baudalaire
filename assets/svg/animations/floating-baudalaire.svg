<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <!-- Gradiente Grão de Café Torrado Baudalaire -->
    <linearGradient id="beanWarmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8C6239" />
      <stop offset="50%" stop-color="#533B2B" />
      <stop offset="100%" stop-color="#2D1E17" />
    </linearGradient>

    <!-- Gradiente Folha Nobre -->
    <linearGradient id="leafWarmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8DA778" />
      <stop offset="100%" stop-color="#4E683E" />
    </linearGradient>

    <!-- Grão de Café -->
    <g id="singleBean">
      <ellipse cx="0" cy="0" rx="16" ry="10" fill="url(#beanWarmGrad)" />
      <path d="M -11,0 Q -2,4 0,0 Q 2,-4 11,0" fill="none" stroke="#2D1E17" stroke-width="2.5" stroke-linecap="round" />
      <path d="M -10,-0.5 Q -2,3.5 0,-0.5 Q 2,-4.5 10,-0.5" fill="none" stroke="#D4A373" stroke-width="0.8" opacity="0.5" />
    </g>

    <!-- Folha Gastronômica -->
    <g id="singleLeaf">
      <path d="M 0,0 Q 18,-14 36,0 Q 18,14 0,0 Z" fill="url(#leafWarmGrad)" />
      <path d="M 0,0 L 33,0" stroke="#FFFFFF" stroke-width="0.9" opacity="0.45" />
    </g>
  </defs>

  <!-- Grão 1: Flutuação suave central -->
  <g transform="translate(80, 90)">
    <animateTransform attributeName="transform" type="translate"
      values="80,90; 86,70; 78,90" dur="7s" repeatCount="indefinite" />
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="15; 30; 15" dur="7s" repeatCount="indefinite" />
      <use href="#singleBean" transform="scale(1.2)" />
    </g>
  </g>

  <!-- Grão 2: Flutuação diagonal direita -->
  <g transform="translate(220, 180)">
    <animateTransform attributeName="transform" type="translate"
      values="220,180; 210,200; 220,180" dur="8.5s" begin="1s" repeatCount="indefinite" />
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="-25; -40; -25" dur="8.5s" begin="1s" repeatCount="indefinite" />
      <use href="#singleBean" transform="scale(0.95)" opacity="0.85" />
    </g>
  </g>

  <!-- Folha Nobre: Balanço orgânico -->
  <g transform="translate(50, 200)">
    <animateTransform attributeName="transform" type="translate"
      values="50,200; 58,185; 50,200" dur="8s" begin="0.5s" repeatCount="indefinite" />
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="-20; -5; -20" dur="8s" begin="0.5s" repeatCount="indefinite" />
      <use href="#singleLeaf" transform="scale(1.1)" opacity="0.85" />
    </g>
  </g>

  <!-- Partículas de Aroma Latte -->
  <g transform="translate(190, 80)">
    <path d="M 0,-5 L 1.2,-1.2 L 5,0 L 1.2,1.2 L 0,5 L -1.2,1.2 L -5,0 L -1.2,-1.2 Z" fill="#D4A373">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="scale" values="0.7;1.3;0.7" dur="3s" repeatCount="indefinite" />
    </path>
  </g>
</svg>
