<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8C6239" />
      <stop offset="100%" stop-color="#4A3528" />
    </linearGradient>
    <linearGradient id="saucerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A373" />
      <stop offset="100%" stop-color="#8C6239" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Pires -->
  <ellipse cx="60" cy="100" rx="42" ry="8" fill="url(#saucerGrad)" opacity="0.9" />
  <ellipse cx="60" cy="99" rx="36" ry="6" fill="#F8F5EE" opacity="0.4" />

  <!-- Xícara -->
  <path d="M 32,55 C 32,92 42,96 60,96 C 78,96 88,92 88,55 Z" fill="url(#cupGrad)" />
  
  <!-- Asa da xícara -->
  <path d="M 85,60 C 102,60 102,82 84,84" fill="none" stroke="url(#cupGrad)" stroke-width="7" stroke-linecap="round" />
  <path d="M 85,60 C 100,60 100,82 85,83" fill="none" stroke="#D4A373" stroke-width="2" stroke-linecap="round" opacity="0.6" />

  <!-- Café no topo -->
  <ellipse cx="60" cy="55" rx="28" ry="7" fill="#2D1E17" />
  <ellipse cx="60" cy="55" rx="24" ry="5.5" fill="#5D4037" />
  <ellipse cx="60" cy="55" rx="18" ry="3.5" fill="#C69255" opacity="0.7">
    <!-- Pulsação de crema -->
    <animate attributeName="rx" values="18;19.5;18" dur="3s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.7;0.9;0.7" dur="3s" repeatCount="indefinite" />
  </ellipse>

  <!-- Fumaça Aromática 1 (SMIL Animated Path) -->
  <path d="M 50,48 Q 45,35 52,25 T 48,8" fill="none" stroke="#D4A373" stroke-width="2.5" stroke-linecap="round" opacity="0">
    <animate attributeName="d" 
      values="M 50,48 Q 44,36 50,26 T 47,8;
              M 50,48 Q 54,34 48,24 T 52,8;
              M 50,48 Q 44,36 50,26 T 47,8" 
      dur="3.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0.75;0.5;0" dur="3.5s" repeatCount="indefinite" />
    <animate attributeName="stroke-dashoffset" from="40" to="0" dur="3.5s" repeatCount="indefinite" />
  </path>

  <!-- Fumaça Aromática 2 (Central) -->
  <path d="M 60,47 Q 66,32 58,20 T 63,4" fill="none" stroke="#C69255" stroke-width="2.8" stroke-linecap="round" opacity="0">
    <animate attributeName="d" 
      values="M 60,47 Q 66,32 58,20 T 63,4;
              M 60,47 Q 54,33 62,21 T 57,4;
              M 60,47 Q 66,32 58,20 T 63,4" 
      dur="4s" begin="0.8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0.85;0.6;0" dur="4s" begin="0.8s" repeatCount="indefinite" />
  </path>

  <!-- Fumaça Aromática 3 (Direita) -->
  <path d="M 70,49 Q 74,38 68,27 T 72,10" fill="none" stroke="#D4A373" stroke-width="2.2" stroke-linecap="round" opacity="0">
    <animate attributeName="d" 
      values="M 70,49 Q 75,38 68,27 T 72,10;
              M 70,49 Q 65,36 71,25 T 67,10;
              M 70,49 Q 75,38 68,27 T 72,10" 
      dur="3.2s" begin="1.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0.7;0.4;0" dur="3.2s" begin="1.5s" repeatCount="indefinite" />
  </path>

  <!-- Partículas de aroma flutuantes -->
  <circle cx="54" cy="30" r="1.5" fill="#D4A373" opacity="0">
    <animate attributeName="cy" values="35;12" dur="3s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0.8;0" dur="3s" repeatCount="indefinite" />
    <animate attributeName="cx" values="54;51;55" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="66" cy="26" r="1.8" fill="#C69255" opacity="0">
    <animate attributeName="cy" values="32;8" dur="3.8s" begin="1.2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0.9;0" dur="3.8s" begin="1.2s" repeatCount="indefinite" />
    <animate attributeName="cx" values="66;70;65" dur="3.8s" begin="1.2s" repeatCount="indefinite" />
  </circle>
</svg>
