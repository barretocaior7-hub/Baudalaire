<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="clocheCoffeeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8C6239" />
      <stop offset="50%" stop-color="#533B2B" />
      <stop offset="100%" stop-color="#38251A" />
    </linearGradient>

    <linearGradient id="clocheLatteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8DAC8" />
      <stop offset="50%" stop-color="#D4A373" />
      <stop offset="100%" stop-color="#8C6239" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#533B2B" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Puxador Superior da Cloche -->
  <circle cx="80" cy="50" r="7" fill="url(#clocheLatteGrad)" filter="url(#softGlow)" />
  <ellipse cx="78" cy="48" rx="2.5" ry="1.5" fill="#FFFFFF" opacity="0.6" />

  <!-- Cúpula Principal da Cloche Gourmet -->
  <path d="M 25,105 C 25,65 50,57 80,57 C 110,57 135,65 135,105 Z" fill="url(#clocheCoffeeGrad)" />
  <path d="M 32,102 C 32,70 52,62 80,62 C 108,62 128,70 128,102" fill="none" stroke="url(#clocheLatteGrad)" stroke-width="1.5" opacity="0.4" />

  <!-- Base / Prato de Servir -->
  <path d="M 16,105 C 16,105 45,103 80,103 C 115,103 144,105 144,105 C 146,107 140,111 80,111 C 20,111 14,107 16,105 Z" fill="url(#clocheLatteGrad)" />
  <line x1="12" y1="113" x2="148" y2="113" stroke="url(#clocheCoffeeGrad)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Fumaça Aromática 1 saindo sob a borda da Cloche (Esquerda) -->
  <path d="M 50,98 Q 42,75 52,60 T 45,30" fill="none" stroke="#D4A373" stroke-width="2.2" stroke-linecap="round" opacity="0">
    <animate attributeName="d" 
      values="M 50,98 Q 40,75 50,60 T 43,30;
              M 50,98 Q 48,73 45,58 T 52,30;
              M 50,98 Q 40,75 50,60 T 43,30" 
      dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0.75;0.35;0" dur="4s" repeatCount="indefinite" />
  </path>

  <!-- Fumaça Aromática 2 saindo pelo topo (Centro) -->
  <path d="M 80,45 Q 86,30 76,18 T 84,4" fill="none" stroke="#8C6239" stroke-width="2.6" stroke-linecap="round" opacity="0">
    <animate attributeName="d" 
      values="M 80,45 Q 86,30 76,18 T 84,4;
              M 80,45 Q 74,32 84,19 T 78,4;
              M 80,45 Q 86,30 76,18 T 84,4" 
      dur="4.5s" begin="0.8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0.85;0.45;0" dur="4.5s" begin="0.8s" repeatCount="indefinite" />
  </path>

  <!-- Fumaça Aromática 3 (Direita) -->
  <path d="M 110,98 Q 118,76 108,62 T 115,32" fill="none" stroke="#D4A373" stroke-width="2" stroke-linecap="round" opacity="0">
    <animate attributeName="d" 
      values="M 110,98 Q 118,76 108,62 T 115,32;
              M 110,98 Q 104,74 114,60 T 107,32;
              M 110,98 Q 118,76 108,62 T 115,32" 
      dur="3.8s" begin="1.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0.7;0.3;0" dur="3.8s" begin="1.5s" repeatCount="indefinite" />
  </path>
</svg>
